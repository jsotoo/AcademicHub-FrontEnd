<div class="confirm-dialog">
  <div class="confirm-dialog__icon" aria-hidden="true">
    <mat-icon>warning</mat-icon>
  </div>

  <h2 mat-dialog-title class="confirm-dialog__title">{{ data.title }}</h2>

  <mat-dialog-content class="confirm-dialog__content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="confirm-dialog__actions" align="end">
    <button mat-stroked-button type="button" [mat-dialog-close]="false">
      {{ data.cancelLabel ?? 'Cancel' }}
    </button>
    <button mat-flat-button type="button" class="confirm-dialog__danger" [mat-dialog-close]="true">
      {{ data.confirmLabel ?? 'Confirm' }}
    </button>
  </mat-dialog-actions>
</div>
