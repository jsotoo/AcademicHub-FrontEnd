<mat-toolbar class="toolbar">
    <button
        mat-icon-button
        class="tollbar__menu-btn"
        aria-label="Abrir menú de navegación"
        (click)="toggleMenu()"
    >
        <mat-icon>menu</mat-icon>
    </button>
    <span class="toolbar__brand">
        <mat-icon class="toolbar__logo-icon">book</mat-icon>
        <span class="toolbar__logo-text">AcademicHub</span>
    </span>

    <span class="toolbar__spacer"></span>

    <button
        mat-button
        [matMenuTriggerFor]="userMenu"
        class="toolbar__user-btn"
        aria-label="Abrir menú de usuario"   
    >
        <mat-icon>account_circle</mat-icon>
        <span class="toolbar__username">{{auth.currentUser()?.userName}}</span>
        <mat-icon>arrow_drop_down</mat-icon>
    </button> 

    <mat-menu #userMenu="matMenu">
        <div class="user-menu-header" mat-menu-item disabled>
            <span>{{auth.currentUser()?.role}}</span>
        </div>
        <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
        </button>
    </mat-menu>

</mat-toolbar>
