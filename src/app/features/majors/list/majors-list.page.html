

<section class="majors-page">
    <header class="majors-header">
      <div class="majors-header__copy">
        <h1 class="majors-title">Majors</h1>
        <p class="majors-subtitle">Directory of majors available in the system.</p>
      </div>
  
      @if (isAdmin()) {
        <button
          mat-flat-button
          class="majors-add"
          routerLink="/majors/new"
        >
          <mat-icon>add</mat-icon>
          Add major
        </button>
      }
    </header>
        
    @if (loading()) {
      <div class="majors-card table-skeleton" aria-hidden="true">
        <div class="table-skeleton__head"></div>
        @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
          <div class="table-skeleton__row"></div>
        }
      </div>
    } @else if (dataSource.data.length === 0) {
      <div class="majors-card majors-card--empty">
        <app-empty-state
          icon="school"
          title="No majors found"
          message="There are no majors available in the system"
        ></app-empty-state>
      </div>
    } @else {
      <div class="majors-card">
        <div class="majors-table-wrap">
          <table mat-table class="majors-table" [dataSource]="dataSource" aria-label="List of majors">
            <ng-container matColumnDef="Code">
              <th mat-header-cell *matHeaderCellDef>Code</th>
              <td mat-cell *matCellDef="let p">
                <span class="code">{{ p.code }}</span>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="Name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let p">
                <span class="name">{{ p.name }}</span>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="Description">
              <th mat-header-cell *matHeaderCellDef>Description</th>
              <td mat-cell *matCellDef="let p">
                <span class="description">{{ p.description }}</span>
              </td>
            </ng-container>
  
  
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef> Actions</th>
              <td mat-cell *matCellDef="let p">
                <button
                  mat-icon-button
                  class="action-btn"
                  matTooltip="See details"
                  [routerLink]="['/majors', p.id, 'detail']"
                  aria-label="See details of the major"
                >
                  <mat-icon>visibility</mat-icon>
                </button>
  
                @if (isAdmin()) {
                  <button
                    mat-icon-button
                    class="action-btn"
                    matTooltip="Edit"
                    (click)="editMajor(p.id)"
                    aria-label="Edit the major"
                  >
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button
                    mat-icon-button
                    class="action-btn"
                    matTooltip="Delete"
                    aria-label="Delete the major"
                    (click)="confirmDeleteMajor(p)"
                  >
                    <mat-icon>delete</mat-icon>
                  </button>
                }
              </td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </div>
  
        <mat-paginator
          class="majors-paginator"
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageIndex]="pageIndex"
          [pageSizeOptions]="[5, 10, 25]"
          (page)="onPageChange($event)"
          aria-label="Pagination of majors"
        />
      </div>
    }
  </section>
